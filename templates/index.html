<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turntable Scanner Control</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #eee; margin-top: 50px; }
        img { border: 2px solid #444; border-radius: 4px; max-width: 100%; height: auto; }
        .btn { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: #fff; }
        .btn-preview { background-color: #17a2b8; }
        .btn-start { background-color: #28a745; }
        .btn-stop { background-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Turntable Camera Control</h1>
    <div>
        <img src="/video_feed" alt="Live Preview Feed">
    </div>
    <div style="margin-top: 20px;">
        <button class="btn btn-preview" onclick="fetch('/preview_scan')">Preview Spin (360°)</button>
        <button class="btn btn-start" onclick="fetch('/trigger')">Start Scan</button>
        <button class="btn btn-stop" onclick="fetch('/stop')">Stop & Erase</button>
    </div>
</body>
</html>
